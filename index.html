<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1b1f25">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%231b1f25%22 stroke=%22%23d4af72%22 stroke-width=%222%22/%3E%3Cpath d=%22M16 16 L22 9%22 stroke=%22%23d4af72%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<title>Morning Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an instrument panel. Fixed left rail of sections (bottom tab bar on phones), one view at a time on the right.
   Graphite surfaces, one brass accent used for "live" things (now, countdowns, active section). */
:root {
  --bg: #eceae6; --panel: #ffffff; --panel-2: #f4f3f0; --line: #dcd9d3; --ink: #15181c; --muted: #6b7079; --faint: #a3a7ad;
  --brass: #8c6a2f; --brass-soft: rgba(140,106,47,.12); --ok: #3f7d5f; --warn: #b4572f; --blue: #3c5d8f;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1f25; --panel: #232830; --panel-2: #2a3039; --line: #353c47; --ink: #eeece7; --muted: #a3aab4; --faint: #6b7480;
    --brass: #d4af72; --brass-soft: rgba(212,175,114,.14); --ok: #74b08f; --warn: #e08e68; --blue: #86a6d6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1f25; --panel: #232830; --panel-2: #2a3039; --line: #353c47; --ink: #eeece7; --muted: #a3aab4; --faint: #6b7480;
  --brass: #d4af72; --brass-soft: rgba(212,175,114,.14); --ok: #74b08f; --warn: #e08e68; --blue: #86a6d6; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.label { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.rail { position: fixed; inset: 0 auto 0 0; width: var(--rail); border-right: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; padding: calc(24px + env(safe-area-inset-top, 0px)) 14px 20px max(14px, env(safe-area-inset-left, 0px)); box-sizing: border-box; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
.brand-mark { width: 30px; height: 30px; border: 1.5px solid var(--ink); border-radius: 50%; display: grid; place-items: center; position: relative; }
.brand-mark::after { content: ""; position: absolute; width: 1.5px; height: 10px; background: var(--brass); top: 4px; left: calc(50% - .75px); transform-origin: 50% 100%; transform: rotate(var(--hand, 0deg)); }
.brand b { font: 700 15px/1 var(--display); font-stretch: 85%; letter-spacing: .08em; text-transform: uppercase; }
.brand small { display: block; font: 500 10px/1.4 var(--mono); color: var(--muted); letter-spacing: .1em; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14px; position: relative; }
.nav a:hover { background: var(--panel-2); color: var(--ink); }
.nav a.on { background: var(--panel-2); color: var(--ink); }
.nav a.on::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; background: var(--brass); border-radius: 0 2px 2px 0; }
.nav svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav kbd { font: 500 10px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.nav .badge { font: 600 10px var(--mono); background: var(--warn); color: var(--panel); border-radius: 999px; padding: 1px 6px; }
.rail-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.clock { font: 600 26px/1 var(--display); font-stretch: 75%; letter-spacing: .02em; }
.sync { display: flex; align-items: center; gap: 7px; font: 500 10.5px var(--mono); color: var(--muted); }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.sync.ok i { background: var(--ok); } .sync.bad i { background: var(--warn); }

main { margin-left: var(--rail); min-height: 100%; box-sizing: border-box; padding-block: 32px 64px;
  padding-left: max(16px, 40px); padding-right: max(16px, env(safe-area-inset-right, 0px), 40px); }
.view { max-width: 1120px; margin: 0 auto; animation: rise .35s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 26px; }
.page-head h1 { font: 700 clamp(2rem, 4.4vw, 3.3rem)/.95 var(--display); font-stretch: 72%; letter-spacing: -.005em; text-transform: uppercase; margin: 6px 0 0; text-wrap: balance; }
.page-head p { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }

.grid { display: grid; gap: 16px; }
.g-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.s-4 { grid-column: span 4; } .s-5 { grid-column: span 5; } .s-6 { grid-column: span 6; } .s-7 { grid-column: span 7; } .s-8 { grid-column: span 8; } .s-12 { grid-column: span 12; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card h2 { font: 700 15px/1.2 var(--display); font-stretch: 85%; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--faint); }
.btn.solid { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.brass { background: var(--brass); color: var(--panel); border-color: var(--brass); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.chip.brass { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 45%, transparent); }
.chip.blue { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, transparent); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field span { font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; box-sizing: border-box; }
.form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.form-row .field { flex: 1 1 110px; }

/* ---------- today ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }
.headline-card { padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.headline { font: 600 clamp(1.7rem, 3.4vw, 2.6rem)/1.05 var(--display); font-stretch: 80%; margin: 0; text-wrap: balance; }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.act { padding: 12px 14px 0 0; }
.act + .act { padding-left: 14px; border-left: 1px solid var(--line); }
.act b { display: block; font: 600 11.5px var(--mono); letter-spacing: .04em; margin-bottom: 4px; }
.act p { margin: 0; font-size: 13.5px; color: var(--muted); }
.dial-card { display: grid; place-items: center; padding: 18px; position: relative; }
.dial { width: 100%; max-width: 320px; height: auto; }
.dial text { font-family: var(--mono); fill: var(--muted); }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.stat { padding: 16px 18px; }
.stat .big { font: 700 2.1rem/1 var(--display); font-stretch: 72%; margin-top: 8px; }
.stat .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.stat.live .big { color: var(--brass); }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.tick { appearance: none; width: 20px; height: 20px; border: 1.5px solid var(--faint); border-radius: 5px; margin: 2px 0 0; cursor: pointer; display: grid; place-items: center; }
.tick:checked { background: var(--ok); border-color: var(--ok); }
.tick:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--panel); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.attn .tick:not(:checked) { border-color: var(--warn); }
.item-t { font-weight: 600; text-decoration: none; }
.item-t:hover { text-decoration: underline; text-underline-offset: 3px; }
.item p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.item .meta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.item .meta a { font: 500 11.5px var(--mono); color: var(--muted); }
.item.done .item-t { text-decoration: line-through; color: var(--muted); }
.item.done p { opacity: .55; }
.okmark { width: 20px; height: 20px; border-radius: 5px; background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 2px; }
.next-title { font: 700 1.6rem/1.05 var(--display); font-stretch: 80%; margin: 0; }
.horizon { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.horizon li { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 14px; }
.date-tile { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; font: 500 10px var(--mono); text-transform: uppercase; color: var(--muted); }
.date-tile b { display: block; font: 700 1.2rem/1 var(--display); font-stretch: 75%; color: var(--ink); }
.horizon a { text-decoration: none; } .horizon a:hover { text-decoration: underline; }

/* ---------- timetable ---------- */
.tt-wrap { overflow-x: auto; }
.tt { display: grid; grid-template-columns: 54px repeat(var(--days), minmax(118px, 1fr)); min-width: 640px; position: relative; }
.tt-head { position: sticky; top: 0; font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 8px 8px 10px; color: var(--muted); border-bottom: 1px solid var(--line); }
.tt-head.today { color: var(--brass); }
.tt-col { position: relative; border-left: 1px solid var(--line); }
.tt-hour { height: var(--hr); font: 500 10.5px var(--mono); color: var(--faint); text-align: right; padding-right: 8px; transform: translateY(-7px); }
.tt-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.slot { position: absolute; left: 4px; right: 4px; border-radius: 7px; padding: 6px 8px; font-size: 12.5px; overflow: hidden; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); text-align: left; }
.slot b { display: block; font-weight: 600; font-size: 12.5px; line-height: 1.2; }
.slot small { font: 500 10.5px var(--mono); color: var(--muted); }
.slot.cal { background: var(--brass-soft); border-color: color-mix(in srgb, var(--brass) 40%, transparent); cursor: default; }
.slot.now { box-shadow: inset 3px 0 0 var(--brass); }
.slot:hover:not(.cal) { border-color: var(--faint); }
.now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--brass); z-index: 2; }
.now-line::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--brass); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font: 500 11px var(--mono); color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line); background: var(--panel-2); }
.legend i.cal { background: var(--brass-soft); border-color: var(--brass); }

/* ---------- SAT ---------- */
.count-card { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
.count-big { font: 800 clamp(3.4rem, 7vw, 5.2rem)/.85 var(--display); font-stretch: 62%; color: var(--brass); }
.bar { height: 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 99px; }
.bar > em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--brass); }
.score-line { display: grid; grid-template-columns: 92px minmax(0, 1fr) 96px; gap: 12px; align-items: center; font-size: 13px; margin-top: 12px; }
.score-line b { font: 700 1.2rem var(--display); font-stretch: 75%; }
.weeks { display: flex; flex-direction: column; gap: 10px; }
.week { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.week > button { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--panel-2); border: 0; cursor: pointer; text-align: left; }
.week.current > button { background: var(--brass-soft); }
.week .wk-dates { font: 500 11px var(--mono); color: var(--muted); }
.week .wk-name { font-weight: 600; }
.week .wk-prog { font: 600 11.5px var(--mono); }
.week ul { list-style: none; margin: 0; padding: 6px 14px 12px; }
.week li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.week li:first-child { border-top: 0; }
.week li.done span { color: var(--muted); text-decoration: line-through; }
.strats { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.strat { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--panel-2); cursor: pointer; text-align: left; min-height: 104px; display: flex; flex-direction: column; gap: 6px; }
.strat b { font: 700 14px/1.2 var(--display); font-stretch: 85%; letter-spacing: .02em; text-transform: uppercase; }
.strat span { font-size: 13px; color: var(--muted); }
.strat.open { border-color: var(--brass); }
.chart { width: 100%; height: auto; display: block; }
.chart text { font: 500 10px var(--mono); fill: var(--muted); }
.log { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.log th { text-align: left; font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.log td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.log td.x { text-align: right; }
.x-btn { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; }
.x-btn:hover { color: var(--warn); }
.today-drill { border-left: 3px solid var(--brass); padding: 4px 0 4px 14px; margin: 0; font-size: 15px; }

/* ---------- news ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.ticker { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; background: var(--panel); }
.tick-cell { flex: 1 0 120px; padding: 14px 16px; border-left: 1px solid var(--line); }
.tick-cell:first-child { border-left: 0; }
.tick-cell b { display: block; font: 700 1.35rem/1 var(--display); font-stretch: 75%; margin-top: 6px; }
.up { color: var(--ok); } .down { color: var(--warn); }
.news { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.story { display: flex; flex-direction: column; gap: 8px; }
.story h3 { font: 700 1.2rem/1.15 var(--display); font-stretch: 85%; margin: 0; text-wrap: balance; }
.story h3 a { text-decoration: none; } .story h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.story p { margin: 0; color: var(--muted); font-size: 14px; }
.why { font-size: 13.5px; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); }
.why b { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--brass); margin-right: 6px; }
.story .meta { display: flex; justify-content: space-between; gap: 8px; font: 500 11px var(--mono); color: var(--muted); margin-top: auto; padding-top: 4px; }

/* ---------- focus ---------- */
.timer { display: grid; place-items: center; gap: 14px; }
.timer svg { width: 220px; height: 220px; max-width: 100%; }
.timer-time { font: 700 3rem/1 var(--display); font-stretch: 70%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font: 500 12px var(--mono); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.habits { display: flex; flex-direction: column; gap: 4px; }
.habit { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.habit:first-child { border-top: 0; }
.dots { display: flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 2px; background: var(--panel-2); border: 1px solid var(--line); }
.dots i.on { background: var(--ok); border-color: var(--ok); }
.prio { display: flex; flex-direction: column; gap: 8px; }
.prio-row { display: grid; grid-template-columns: 24px 20px minmax(0, 1fr); gap: 10px; align-items: center; }
.prio-row .n { font: 700 1.1rem var(--display); color: var(--faint); }
.prio-row input[type=text] { background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 6px 2px; width: 100%; min-width: 0; }
.prio-row.done input[type=text] { text-decoration: line-through; color: var(--muted); }
.tips-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tip { padding: 12px 0; border-top: 1px solid var(--line); }
.tip:first-child { border-top: 0; }
.tip b { display: block; font-weight: 600; }
.tip span { color: var(--muted); font-size: 14px; }
.tip-hero { font: 600 1.35rem/1.2 var(--display); font-stretch: 85%; margin: 0 0 6px; }

/* ---------- apps ---------- */
.apps { display: flex; flex-direction: column; }
.app-row { display: grid; grid-template-columns: minmax(0, 1.4fr) 140px minmax(0, 1.6fr) 110px 28px; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.app-row:first-child { border-top: 0; }
.app-row b { font-weight: 600; }
.app-row select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
.app-row small { display: block; color: var(--muted); font-size: 12.5px; }
.due { font: 500 11.5px var(--mono); }
.due.soon { color: var(--warn); }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }
.loading { padding: 80px 0; text-align: center; font: 500 12px var(--mono); color: var(--muted); }
.mob-head { display: none; }

@media (max-width: 1000px) {
  .s-4, .s-5, .s-6, .s-7, .s-8 { grid-column: span 12; }
  .hero { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .news { grid-template-columns: 1fr; }
  .app-row { grid-template-columns: minmax(0, 1fr) 130px 28px; }
  .app-row .next, .app-row .due { grid-column: 1 / -1; }
}
@media (max-width: 760px) {

  const c = $('#clock'); if (c) c.textContent = hmStr(z.hh + z.mm / 60);
  const mc = $('#mob-clock'); if (mc) mc.textContent = hmStr(z.hh + z.mm / 60) + ' Dubai';
  const bm = $('#brand-mark'); if (bm) bm.style.setProperty('--hand', (z.h / 24) * 360 + 180 + 'deg');
  const bd = $('#brand-date'); if (bd) bd.textContent = fmtDay(z.ymd, { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
  const gw = $('#greet-word'); if (gw && gw.textContent !== greeting() + ',') gw.textContent = greeting() + ',';
  const B = S.brief; if (!B) return;
  const isToday = z.ymd === B.date;
  const [x, y] = pt(z.h, R);
  const hl = $('#hand-l'), hd = $('#hand-d'), hand = $('#hand');
  if (hl) { hl.setAttribute('x2', x); hl.setAttribute('y2', y); hd.setAttribute('cx', x); hd.setAttribute('cy', y); hand.style.display = isToday ? '' : 'none'; }
  const evs = (B.events || []).map(e => ({ ...e, S: new Date(e.start), E: new Date(e.end) })).filter(e => e.E > now).sort((a, b) => a.S - b.S);
  const nx = evs[0];
  const da = $('#dial-a'), db = $('#dial-b');
  if (da) { da.textContent = isToday ? hmStr(z.hh + z.mm / 60) : fmtDay(B.date, { weekday: 'short' }).toUpperCase(); db.textContent = nx ? (nx.S <= now ? 'IN ' + nx.title.toUpperCase() : `NEXT ${nx.title.toUpperCase().slice(0, 18)} · ${until(nx.S - now)}`) : 'NOTHING SCHEDULED'; }
  const sn = $('#st-next'), ss = $('#st-next-sub');
  if (sn) { sn.textContent = nx ? (nx.S <= now ? 'Now' : until(nx.S - now)) : 'Clear'; ss.textContent = nx ? `${nx.title} · ${fmtTime(nx.S)}` : 'No more events'; }
  const card = $('#next-card');
  const cardKey = nx ? `${nx.title}|${nx.S <= now}|${z.mm}` : 'none';
  if (card && card.dataset.k !== cardKey) {
    card.dataset.k = cardKey;
    card.innerHTML = '';
    card.append(el('div', { class: 'card-h' }, el('h2', { text: nx && nx.S <= now ? 'Happening now' : 'Next up' }), nx && nx.rsvp === 'needsAction' ? el('span', { class: 'chip warn', text: 'not replied' }) : null));
    if (!nx) card.append(el('p', { class: 'empty', text: 'Nothing else on the calendar.' }));
    else card.append(el('p', { class: 'next-title', text: nx.title }),
      el('div', { class: 'mono num', style: { marginTop: '8px', fontSize: '13px' }, text: `${fmtTime(nx.S)}–${fmtTime(nx.E)}${nx.other_tz ? ` · ${fmtTime(nx.S, nx.other_tz.zone)} ${nx.other_tz.label}` : ''}` }),
      nx.with ? el('div', { class: 'muted', style: { fontSize: '13px', marginTop: '2px' }, text: nx.with }) : null,
      el('div', { class: 'form-row', style: { marginTop: '14px' } }, nx.join_url ? el('a', { class: 'btn solid', href: nx.join_url, text: 'Join call' }) : null, nx.url ? el('a', { class: 'btn', href: nx.url, text: nx.rsvp === 'needsAction' ? 'Reply to invite' : 'Open event' }) : null));
  }
  const nl = $('#tt-now'); if (nl) nl.style.top = (z.h - +nl.dataset.min) * +nl.dataset.hr + 'px';
  // timer
  const tt = $('#tm-time');
  if (T.running && timerLeft() === 0) {
    T.running = false; T.endsAt = null; T.remaining = T.mode * 60; T.sessions = { ...(T.sessions || {}), [todayYmd()]: ((T.sessions || {})[todayYmd()] || 0) + 1 }; local.set('timer', T);
    toast('Block complete. Take a 5-minute break.'); if (S.view === 'focus') rerender();
  }
  if (tt) { const left = timerLeft(); tt.textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
    const ring = $('#tm-ring'); const CIRC = 2 * Math.PI * 96; ring.setAttribute('stroke-dashoffset', CIRC * (1 - left / (T.mode * 60))); }
}

/* ================= boot ================= */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches('input, textarea, select')) return;
  const v = VIEWS.find(v => v[2] === e.key); if (v) location.hash = v[0];
});
window.addEventListener('hashchange', route);
$('#sync').addEventListener('click', syncDialog);
$('#lock-btn').addEventListener('click', () => { local.set('pw', ''); location.reload(); });
loadBrief();
setInterval(tick, 1000);
tick();
})();
</script>
